[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docket"
version = "0.2.0"
description = "A git-friendly record of every API call a command makes: the payload, the response, and why."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
docket = "docket.cli:main"

[tool.setuptools]
packages = ["docket"]
include-package-data = true

[tool.setuptools.package-data]
docket = ["shim/*.py", "shim/curl", "shim/*.cjs", "shim/*.json"]
