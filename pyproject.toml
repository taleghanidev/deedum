[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docket"
version = "0.3.0"
description = "A git-friendly record of every API call a command makes: the payload, the response, and why."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "taleghanidev and the deedum contributors", email = ""}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License",
               "Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Topic :: System :: Logging"]

[project.urls]
Homepage = "https://github.com/taleghanidev/docket"
Changelog = "https://github.com/taleghanidev/docket/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
docket = "docket.cli:main"

[tool.setuptools]
packages = ["docket"]
include-package-data = true

[tool.setuptools.package-data]
docket = ["shim/*.py", "shim/curl", "shim/_exec", "shim/*.cjs", "shim/*.json"]
